name: Build and Enterprise CI

on:
  pull_request:
  push:
    branches: [main, live-person-workflow]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify 44-check and Stage 45 phase wiring
        run: bun run verify:phase-wiring
      - name: Fail-closed release safety checks
        run: bun run verify:release-safety
      - name: Daisy foundational instruction and no-simulated-success checks
        run: bun run verify:daisy-safety
      - name: First-party inference fail-closed tests
        run: bun run test:local-inference
      - name: Compile native Daisy server entrypoint
        run: bunx esbuild Solvex-core/server.ts --bundle --platform=node --format=cjs --packages=external --outfile=/tmp/solvex-core-server.cjs
      - name: Payments-disabled boundary checks
        run: bun run verify:payments-disabled
      - name: Sandbox, memory, proof persistence, and tenant crypto tests
        run: bun run test:security-controls
      - name: Disposable Neon tenant isolation integration test
        env:
          SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL: ${{ secrets.SOLVEX_NEON_ISOLATION_TEST_DATABASE_URL }}
          SOLVEX_NEON_TEST_TENANT_A: ${{ secrets.SOLVEX_NEON_TEST_TENANT_A }}
          SOLVEX_NEON_TEST_TENANT_B: ${{ secrets.SOLVEX_NEON_TEST_TENANT_B }}
        run: bash scripts/verify_neon_tenant_isolation_ci.sh
      - name: Build
        run: bun run build
      - name: TypeScript
        run: bun run lint
      - name: Build digest-pinned sandbox execution image
        id: sandbox
        env:
          NODE_BASE_IMAGE: node:22.23-slim@sha256:47725aca53d3295ec2d3be8f62726599b3033cc262edc2c7e429909b3ac599fc
        run: |
          docker build --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" -f sandbox/Dockerfile -t solvex-sandbox:ci sandbox
          image_id="$(docker image inspect --format '{{.Id}}' solvex-sandbox:ci)"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "SOLVEX_SANDBOX_IMAGE=$image_id" >> "$GITHUB_ENV"
      - name: Prepare ephemeral proof evidence store
        run: |
          mkdir -p "$RUNNER_TEMP/solvex-proof-evidence"
          proof_key="$(openssl rand -hex 32)"
          tenant_root_key="$(openssl rand -hex 32)"
          echo "SOLVEX_PROOF_DIR=$RUNNER_TEMP/solvex-proof-evidence" >> "$GITHUB_ENV"
          echo "SOLVEX_PROOF_HMAC_KEY=$proof_key" >> "$GITHUB_ENV"
          echo "SOLVEX_TENANT_ROOT_KEY=$tenant_root_key" >> "$GITHUB_ENV"
      - name: Enterprise invariants
        run: bun run verify:enterprise
      - name: Proof closure
        env:
          SOLVEX_SANDBOX_IMAGE: ${{ steps.sandbox.outputs.image_id }}
          # Verified Vercel project target for this repository. This identifies
          # the deployment destination; it does not deploy or authorize production traffic.
          SOLVEX_DEPLOYMENT_TARGET: "vercel://team_uReepq4IFAwtT6YDQyGPnwQB/prj_xDcwUu9Ls9OWsJ7EHuYGlKaqE5go"
          SOLVEX_DEPLOYMENT_TARGET_VERIFIED: "true"
        run: bun run verify:proof-closure
      - name: Upload Stage 45 readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-45-readiness
          path: |
            artifacts/stage-45-readiness.json
            artifacts/stage-45-readiness.md
          if-no-files-found: ignore
